[package]
name = "ledger"
version = "1.0.0"
description = "Ledger: a personal finance tracker for the desktop, backed by Google Sheets."
edition = "2021"
rust-version = "1.77"

[lib]
name = "ledger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = { version = "0.5", features = ["std"] }
tokio = { version = "1", features = ["net", "time", "io-util"] }
url = "2"
open = "5"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

# Argon2 is slow in unoptimised builds; keep `tauri dev` snappy.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
